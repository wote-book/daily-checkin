<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f5f7" />
  <title>每日打卡</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar"><div><p class="eyebrow">DAILY CHECK-IN</p><h1>每日打卡</h1></div><button id="themeBtn" class="icon-btn" aria-label="切换主题">☾</button></header>
    <main>
      <section id="homePage" class="page active"><div class="hero"><div><p id="todayText"></p><h2>保持节奏，继续坚持。</h2></div><div class="hero-actions"><button id="viewModeBtn" class="secondary small">▦ 小卡片</button><button id="addTypeBtn" class="primary small">＋ 新增</button></div></div><div id="typeList"></div><div id="emptyState" class="empty hidden"><div class="empty-icon">＋</div><h3>还没有打卡类型</h3><p>点击右上角新增你的第一个目标</p></div></section>
      <section id="summaryPage" class="page"><div class="page-title"><p class="eyebrow">OVERVIEW</p><h2>汇总</h2></div><div id="summaryStats" class="stats-grid"></div><div class="panel universe-panel"><div class="panel-head"><h3>记录谱图宇宙</h3><span>拖动节点 · 滚轮缩放 · 点击查看</span></div><div class="universe-stage"><canvas id="radar" width="760" height="440" aria-label="由真实打卡数据生成的交互式记录谱图"></canvas><button id="universeReset" class="universe-reset">重置视角</button></div><p class="universe-hint">中心是你的全部记录，周围节点代表打卡类型；节点越大表示打卡次数越多。</p></div><div class="panel"><div class="panel-head"><h3>最近趋势</h3><div class="seg"><button class="active" data-days="7">7天</button><button data-days="30">30天</button></div></div><canvas id="trend" width="600" height="190"></canvas></div><div class="panel advice"><div class="panel-head"><h3>今日建议</h3><span>本地分析</span></div><div id="adviceText"></div></div></section>
      <section id="settingsPage" class="page"><div class="page-title"><p class="eyebrow">PREFERENCES</p><h2>设置</h2></div><div class="settings-list"><button id="exportBtn" class="setting"><span>导出 JSON 备份</span><b>›</b></button><button id="importBtn" class="setting"><span>导入 JSON（覆盖当前数据）</span><b>›</b></button><button id="trashBtn" class="setting"><span>回收站 <small id="trashCount"></small></span><b>›</b></button><button id="notifyBtn" class="setting"><span>开启浏览器提醒</span><b>›</b></button></div><div class="panel about"><h3>每日打卡</h3><p>数据只保存在当前设备浏览器中。建议每周导出一次备份。</p></div></section>
    </main>
    <nav class="bottom-nav"><button class="nav-item active" data-page="homePage">⌂<span>首页</span></button><button class="nav-item" data-page="summaryPage">◔<span>汇总</span></button><button class="nav-item" data-page="settingsPage">⚙<span>设置</span></button></nav>
  </div>
  <input id="importFile" type="file" accept="application/json" hidden />
  <div id="modalRoot"></div><div id="toast" class="toast"></div>
  <script src="app.js"></script>
  <script src="graph.js"></script>
  <script src="features.js"></script>
  <link rel="stylesheet" href="features.css" />
</body>
</html>
