<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f5f7" />
  <title>每日打卡</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar"><div><p class="eyebrow">DAILY CHECK-IN</p><h1>每日打卡</h1></div><button id="themeBtn" class="icon-btn" aria-label="切换主题">☾</button></header>
    <main>
      <section id="homePage" class="page active"><div class="hero"><div><p id="todayText"></p><h2>保持节奏，继续坚持。</h2></div><div class="hero-actions"><button id="sortBtn" class="secondary small">⇅ 排序</button><button id="viewModeBtn" class="secondary small">▦ 小卡片</button><button id="addTypeBtn" class="primary small">＋ 新增</button></div></div><div id="typeList"></div><div id="emptyState" class="empty hidden"><div class="empty-icon">＋</div><h3>还没有打卡类型</h3><p>点击右上角新增你的第一个目标</p></div></section>
      <section id="summaryPage" class="page"><div class="page-title summary-title"><div><p class="eyebrow">OVERVIEW</p><h2>汇总</h2></div><div class="period-filter"><select id="periodMode" aria-label="时间范围"><option value="all">全部时间</option><option value="year">按年查看</option><option value="month">按月查看</option></select><select id="periodYear" aria-label="年份"></select><select id="periodMonth" aria-label="月份"></select></div></div><p id="periodLabel" class="period-label"></p><div id="summaryStats" class="stats-grid"></div><div class="panel universe-panel"><div class="panel-head"><h3>记录谱图宇宙</h3><span>拖动节点 · 滚轮缩放 · 点击查看</span></div><div class="universe-stage"><canvas id="radar" width="760" height="440" aria-label="由真实打卡数据生成的交互式记录谱图"></canvas><button id="universeReset" class="universe-reset">重置视角</button></div><p class="universe-hint">谱图会随当前筛选时间变化；没有记录的类型会保留为较小节点。</p></div><div class="panel trend-panel"><div class="panel-head trend-head"><div><h3>打卡趋势</h3><p id="trendSummary" class="trend-summary"></p></div><div class="trend-controls"><select id="trendMetric" aria-label="趋势指标"><option value="count">打卡次数</option><option value="types">完成类型</option><option value="days">打卡天数</option></select><select id="trendType" aria-label="打卡类型"><option value="all">全部类型</option></select></div></div><div class="trend-stage"><canvas id="trend" width="760" height="260" aria-label="打卡趋势图"></canvas><div id="trendEmpty" class="trend-empty hidden"></div></div><div id="trendDetail" class="trend-detail">点击柱状图查看具体日期成果</div></div><div class="panel advice"><div class="panel-head"><h3>阶段建议</h3><span>本地分析</span></div><div id="adviceText"></div></div></section>
      <section id="settingsPage" class="page"><div class="page-title"><p class="eyebrow">PREFERENCES</p><h2>设置</h2></div><div class="settings-list"><button id="exportBtn" class="setting"><span>导出 JSON 备份</span><b>›</b></button><button id="importBtn" class="setting"><span>导入 JSON（覆盖当前数据）</span><b>›</b></button><button id="trashBtn" class="setting"><span>回收站 <small id="trashCount"></small></span><b>›</b></button><button id="notifyBtn" class="setting"><span>开启浏览器提醒</span><b>›</b></button></div><div class="panel about"><h3>每日打卡</h3><p>数据只保存在当前设备浏览器中。建议每周导出一次备份。</p></div></section>
    </main>
    <nav class="bottom-nav"><button class="nav-item active" data-page="homePage">⌂<span>首页</span></button><button class="nav-item" data-page="summaryPage">◔<span>汇总</span></button><button class="nav-item" data-page="settingsPage">⚙<span>设置</span></button></nav>
  </div>
  <input id="importFile" type="file" accept="application/json" hidden />
  <div id="modalRoot"></div><div id="toast" class="toast"></div>
  <script src="app.js"></script>
  <script src="graph.js"></script>
  <script src="features.js"></script>
  <script src="analytics.js"></script>
  <script src="compat.js"></script>
  <link rel="stylesheet" href="features.css" />
  <link rel="stylesheet" href="analytics.css" />
</body>
</html>
